<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auto Like & Scroll</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 240px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, sans-serif;
      background: #fff;
      color: #111;
    }
    h1 { font-size: 16px; margin: 0 0 4px; }
    .sub { font-size: 11px; color: #777; margin: 0 0 12px; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
    }
    .row:last-of-type { border-bottom: none; }
    .switch { position: relative; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; cursor: pointer;
      background: #bbb; border-radius: 24px; transition: .2s;
    }
    .slider::before {
      content: ""; position: absolute; height: 18px; width: 18px;
      left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s;
    }
    .switch input:checked + .slider { background: #6b48ff; }
    .switch input:checked + .slider::before { transform: translateX(20px); }
    p.note { font-size: 11px; color: #777; margin: 10px 0 0; }
    @media (prefers-color-scheme: dark) {
      body { background: #1b1f23; color: #eee; }
      .row { border-color: #333; }
      .slider { background: #555; }
    }
  </style>
</head>
<body>
  <h1>Auto Like & Scroll</h1>
  <p class="sub">TikTok ও LinkedIn-এ কাজ করবে</p>

  <div class="row">
    <span>Auto Like</span>
    <label class="switch">
      <input type="checkbox" id="autoLike">
      <span class="slider"></span>
    </label>
  </div>

  <div class="row">
    <span>Auto Scroll</span>
    <label class="switch">
      <input type="checkbox" id="autoScroll">
      <span class="slider"></span>
    </label>
  </div>

  <p class="note">TikTok বা LinkedIn tab খোলা থাকলে সাথে সাথে কার্যকর হয়।</p>

  <script src="popup.js"></script>
</body>
</html>
